<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Torneo Scalperos</title>
  <link rel="stylesheet" href="styles_v2.css?v=11" />
  <script>
    addEventListener('submit', e => { e.preventDefault(); e.stopImmediatePropagation(); return false; }, true);
  </script>
</head>
<body>
  <!-- HERO -->
  <div class="hero">
    <img src="assets/escalperos_logo.png" alt="Scalperos — Torneo" class="hero-logo animate-in" />
    <div id="timer" class="timer">
      <div class="timer-count">Cargando…</div>
      <div class="timer-sub">3 Oct 2025 — 9:00 AM → 1:00 PM (Hora Colombia)</div>
    </div>
  </div>

  <!-- CTA -->
  <div class="cta-wrap">
    <button id="btnOpenForm" class="cta-brand">Inscríbete</button>
  </div>

  <!-- LOG -->
  <div id="log" class="log"></div>

  <!-- Leaderboard -->
  <div id="grid" class="grid"></div>

  <!-- MODAL -->
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="titleIns">
      <button class="modal-close" id="btnCloseModal" aria-label="Cerrar">×</button>
      <h2 id="titleIns" class="modal-title">Inscripción</h2>

      <div id="formRegister" class="form" role="form" aria-label="Formulario de inscripción">
        <label class="field">
          <span>Nombre</span>
          <input type="text" id="inpName" required maxlength="120" placeholder="Tu nombre" autocomplete="off" />
        </label>
        <label class="field">
          <span>Correo</span>
          <input type="email" id="inpEmail" required maxlength="200" placeholder="tu@correo.com" autocomplete="off" />
        </label>
        <button type="button" id="btnSend" class="btn-submit breathe blink">Enviar</button>
        <div id="formMsg" class="form-msg" role="alert"></div>
      </div>
    </div>
  </div>

<script>
console.log('client_v2 v11');

(function(){
  const $ = s => document.querySelector(s);

  // Frases para el LOG
  const QUOTES = [
    "La paciencia cambia la perspectiva.",
    "El que sabe cuándo es suficiente, siempre tendrá bastante.",
    "Gestiona el riesgo, no el resultado.",
    "Menos es más: disciplina > impulso.",
    "Deja correr ganancias, corta pérdidas.",
    "La consistencia vence al ruido.",
    "Planifica el trade, tradea el plan."
  ];
  const pickQuote = () => QUOTES[Math.floor(Math.random()*QUOTES.length)];

  // TIMER
  const START_UTC = Date.UTC(2025, 9, 4, 14, 0, 0);
  const END_UTC   = Date.UTC(2025, 9, 4, 18, 0, 0);
  function fmtDHMS(ms){ if(ms<0) ms=0; const s=Math.floor(ms/1000);
    const d=Math.floor(s/86400), h=Math.floor((s%86400)/3600), m=Math.floor((s%3600)/60), sec=s%60;
    return (d>0?`${d}d `:'')+`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }
  function updateTimer(){
    const el=$("#timer"); if(!el) return;
    const now=Date.now(), c=el.querySelector('.timer-count'); if(!c) return;
    c.classList.remove('critical');
    if(now<START_UTC){ c.textContent=`Comienza en ${fmtDHMS(START_UTC-now)}`; }
    else if(now<=END_UTC){ const r=END_UTC-now; c.textContent=`Termina en ${fmtDHMS(r)}`; if(r<=10*60*1000) c.classList.add('critical'); }
    else{ c.textContent='Finalizado'; }
  }
  setInterval(updateTimer,1000); updateTimer();

  // LOG (arriba)
  const logEl=$("#log");
  function logInline(msg){
    if(!logEl) return;
    const ts=new Date().toLocaleTimeString(); const piece=`[${ts}] ${msg}`;
    if(logEl.textContent && !logEl.textContent.endsWith(' ')) logEl.textContent+=' ';
    logEl.textContent+=piece; logEl.scrollTop=logEl.scrollHeight;
  }

  // GRID / tarjetas
  let ws=null; const gridEl=$("#grid");
  function fmtMoneySigned(v){ const n=Number(v||0); return (n>=0?'+$':'-$')+Math.abs(n).toFixed(2); }
  function fmtMoneyPlain(v){ const n=Number(v||0); return '$'+n.toFixed(2); }
  function clsByVal(v){ const n=Number(v||0); return (n>=0)?'pos':'neg'; }
  function safeNum(x, d=0){ const n=Number(x); return Number.isFinite(n)? n : d; }

  function renderLeaderboard(rows){
    if(!gridEl) return;
    gridEl.innerHTML="";
    const list = Array.isArray(rows) ? rows.slice() : [];
    list.sort((a,b)=>(safeNum(b.pnl,0)-safeNum(a.pnl,0)));
    list.forEach((p,i)=>{
      const card=document.createElement('div'); card.className='card bar enter';
      if(p.eliminated) card.classList.add('eliminated');

      const saldo = (p.account_balance!=null) ? fmtMoneyPlain(safeNum(p.account_balance,0)) : '—';
      const pnlVal = safeNum(p.pnl,0);
      const pnl   = fmtMoneySigned(pnlVal);
      const ddVal = safeNum(p.max_dd,0);
      const ddTxt = ddVal.toFixed(2);
      const wrTxt = safeNum(p.winrate,0).toFixed(1) + '%';

      card.innerHTML=`
        ${p.eliminated?'<div class="ribbon">DESCALIFICADO</div>':''}
        <div class="bar-left">
          <div class="rank">#${i+1}</div>
          <div class="name">${(p.display_name ?? p.handle) || '-'}</div>
          <div class="last">Último: ${(p.last_symbol || '-')} @ ${(p.last_price ?? '-')}</div>
        </div>

        <div class="bar-kpis">
          <div class="kpi"><div class="label">Saldo</div><div class="value">${saldo}</div></div>
          <div class="kpi"><div class="label">PNL</div><div class="value ${clsByVal(pnlVal)}">${p.pnl!=null? pnl : '—'}</div></div>
          <div class="kpi"><div class="label">Trades</div><div class="value">${safeNum(p.trades,0)}</div></div>
          <div class="kpi"><div class="label">Winrate</div><div class="value">${wrTxt}</div></div>
          <div class="kpi"><div class="label">Drawdown</div><div class="value ${clsByVal(ddVal)}">${ddTxt}</div></div>
        </div>`;
      gridEl.appendChild(card);
    });
  }

  // Conexión WS + LOG con "🪙 TOKEN" (solo en log superior)
  (function connect(){
    try{
      if(ws && ws.readyState===WebSocket.OPEN) return;
      const scheme=location.protocol==='https:'?'wss':'ws';
      ws=new WebSocket(`${scheme}://${location.host}/ws/leaderboard`);
      ws.onopen =()=>{
        logInline('✅ Conectado al servidor');
        logInline('🪙 TOKEN');
        logInline(pickQuote());
      };
      ws.onclose=e=>logInline(`❌ Conexión cerrada (code=${e.code})`);
      ws.onerror=()=>logInline('⚠️ WS error');
      ws.onmessage=ev=>{
        try{
          const msg=JSON.parse(ev.data);
          // Marca de token solo en LOG
          logInline('🪙 TOKEN');
          if(msg.type==='leaderboard'){
            renderLeaderboard(msg.rows||[]);
            logInline('📊 leaderboard actualizado');
            if(Math.random()<0.3) logInline(pickQuote());
          }
          // pings/heartbeat no modifican tarjetas aquí (saldo llega por HB y se usa en el próximo payload server-side)
        }catch(err){ console.error('WS parse error', err); }
      };
    }catch(e){ console.error('WS error', e); }
  })();

  // Modal
  const modal   = $("#modal");
  const btnOpen = $("#btnOpenForm");
  const btnClose= $("#btnCloseModal");
  const msgBox  = $("#formMsg");
  const btnSend = $("#btnSend");
  const inpName = $("#inpName");
  const inpEmail= $("#inpEmail");

  function openModal(){ if(!modal) return; modal.classList.add('open'); modal.setAttribute('aria-hidden','false'); inpName?.focus(); }
  function closeModal(){ if(!modal) return; modal.classList.remove('open'); modal.setAttribute('aria-hidden','true'); if(inpName) inpName.value=''; if(inpEmail) inpEmail.value=''; if(msgBox){ msgBox.textContent=''; msgBox.classList.remove('ok'); } }

  document.addEventListener('DOMContentLoaded', () => closeModal());
  btnOpen?.addEventListener('click', openModal);
  btnClose?.addEventListener('click', closeModal);
  modal?.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });
  addEventListener('keydown', e=>{ if(e.key==='Escape' && modal?.classList.contains('open')) closeModal(); });

  [inpName, inpEmail].forEach(i=>{
    i?.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); btnSend?.click(); }
    });
  });

  btnSend?.addEventListener('click', async ()=>{
    if(!msgBox) return;
    msgBox.textContent=''; msgBox.classList.remove('ok');
    const name=(inpName?.value||'').trim(), email=(inpEmail?.value||'').trim();
    if(!name || !email){ msgBox.textContent='Completa todos los campos.'; return; }
    try{
      const resp = await fetch('/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name,email}) });
      const data = await resp.json();
      if(!resp.ok || data.ok===false) throw new Error(data.detail || 'Error registrando');
      msgBox.textContent = data.message || 'Inscripción registrada. ¡Gracias!';
      msgBox.classList.add('ok');
      setTimeout(closeModal, 1200);
    }catch(err){
      msgBox.textContent = 'Error: ' + err.message;
    }
  });
})();
</script>
</body>
</html>
